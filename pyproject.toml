[tool.poetry]
name = "clinic-platform-backend"
version = "0.1.0"
description = "Platform backend for the Apollo Clinic voice AI receptionist: scheduling engine, patient records, call state, and mock PMS write-back"
authors = ["Abhisek Omkar Prasad <67184718+AbhisekOmkar@users.noreply.github.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
motor = "^3.6.0"
pymongo = "^4.9.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
httpx = "^0.28.1"
loguru = "^0.7.3"
python-dotenv = "^1.0.1"
livekit-api = "^1.0.1"
phonenumbers = "^9.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^1.0.0"
pytest-cov = "^6.0.0"
black = "^24.1.0"
ruff = "^0.2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
lint.select = ["E", "W", "F", "I", "B", "C4"]
lint.ignore = ["E501"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
